# install dependency and current package
name: Test Poetry Project

on:
  pull_request:
    types:
      - review_requested
      - opened
    branches:
      - beta
      - release
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test'
        required: true

concurrency:
  group: test-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  install-test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository && (github.event.action != 'opened' || startsWith(github.head_ref, 'deps/'))
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14", "3.11", "3.10"]
    steps:
      #----------------------------------------------
      #       check-out repo and set-up python
      #----------------------------------------------
      - uses: actions/checkout@v7
        with:
            ref: ${{ github.event.inputs.pr_number && format('refs/pull/{0}/head', github.event.inputs.pr_number) || github.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true

      - name: Install and Test
        env:
          TEST_UIN: ${{ secrets.TEST_UIN }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          echo "::group::Install Basic Dependencies"
          uv sync --no-default-groups --group test
          echo "::endgroup::"

          echo "::group::pytest outputs"
          uv run pytest test --log-cli-level=WARNING
          echo "::endgroup::"

      - name: Request Changes
        env:
          GH_TOKEN: ${{ secrets.COMMENT_PAT }} # the reviewer PAT
        run: |
          if [[ $GH_TOKEN != "" ]]; then
              gh pr review ${{ github.event.pull_request.number }} -r -b "Some test(s) failed."
          fi
